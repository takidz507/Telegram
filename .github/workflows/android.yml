name: Tikgram Android

# Builds a DEBUG APK on every push / pull request and on manual dispatch.
#
# Secrets (optional — the build works without them, with limits):
#   TELEGRAM_API_ID / TELEGRAM_API_HASH — your own Telegram API credentials
#     from https://my.telegram.org. When set, they replace the placeholder
#     values in BuildVars.java. When absent, the build keeps the repo's
#     shipped keys: the APK installs, runs and can log in, but it shares
#     Telegram's per-app quota with every other stock build, so your own
#     keys are still recommended for a release build.
#   KEYSTORE_BASE64 / KEY_ALIAS / KEY_PASSWORD / STORE_PASSWORD — release
#     signing. When ALL are set, a signed release APK is also produced.
#     When absent, only the debug-signed APK is produced.
# No secret value is ever written into the repository or into logs.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17 (required by Android Gradle Plugin 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        # Versions are taken from the repo itself, not guessed:
        #   compileSdk 36 / buildTools 36.0.0 / ndkVersion 27.2.12479018
        #   cmake 3.22.1  (TMessagesProj/build.gradle)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1" "platform-tools"

      - name: Inject Telegram API keys from secrets (if present)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          FILE="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          if [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ]; then
            echo "Using API keys from secrets."
            sed -i "s/public static int APP_ID = [0-9][0-9]*/public static int APP_ID = $TELEGRAM_API_ID/" "$FILE"
            sed -i "s|public static String APP_HASH = \"[^\"]*\"|public static String APP_HASH = \"$TELEGRAM_API_HASH\"|" "$FILE"
          else
            echo "No API secrets set — keeping shipped keys (debug APK logs in; your own keys are recommended for release)."
          fi
          grep -n "APP_ID = \|APP_HASH = " "$FILE" | sed 's/014b35b6184100b085b0d0572f9b5103/<placeholder-hash>/;s/[0-9a-f]\{32\}/<hash>/'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tikgram-debug-apk
          path: TMessagesProj/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release-signed:
    name: Build signed release APK (only when signing secrets exist)
    runs-on: ubuntu-latest
    # NOTE: GitHub does not allow the `secrets` context in a job-level `if`
    # (the whole run then fails as an invalid workflow file). So the gate
    # lives on every step below via job-level env instead: when any signing
    # secret is absent, all steps skip and the debug APK from the job above
    # is the only output.
    needs: build-debug
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
    steps:
      - name: Check out repository (with submodules)
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != '' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != '' }}
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != '' }}
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1" "platform-tools"

      - name: Inject Telegram API keys from secrets (if present)
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != '' }}
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          FILE="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          if [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ]; then
            sed -i "s/public static int APP_ID = [0-9][0-9]*/public static int APP_ID = $TELEGRAM_API_ID/" "$FILE"
            sed -i "s|public static String APP_HASH = \"[^\"]*\"|public static String APP_HASH = \"$TELEGRAM_API_HASH\"|" "$FILE"
          fi

      - name: Restore release keystore from secret
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          ls -la release.keystore

      - name: Build unsigned release APK
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != '' }}
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:assembleRelease --stacktrace

      - name: Sign release APK
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != '' }}
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          UNSIGNED=$(ls TMessagesProj/build/outputs/apk/release/*-unsigned.apk 2>/dev/null | head -1)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(ls TMessagesProj/build/outputs/apk/release/*.apk | head -1)
          fi
          echo "Signing $UNSIGNED"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" tikgram-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out tikgram-release-signed.apk tikgram-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify tikgram-release-signed.apk

      - name: Upload signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tikgram-release-apk
          path: tikgram-release-signed.apk
          if-no-files-found: error
